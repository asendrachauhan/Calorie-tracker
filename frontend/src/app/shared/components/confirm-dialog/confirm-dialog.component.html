<div
  *ngIf="confirmService.isOpen()"
  class="confirm-backdrop"
  (click)="confirmService.handleCancel()"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'confirm-dialog-title'"
  [attr.aria-describedby]="'confirm-dialog-desc'">
  <div class="confirm-modal" (click)="$event.stopPropagation()">
    <div class="confirm-header">
      <div class="confirm-icon" [class.danger]="confirmService.options().isDangerous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h3 id="confirm-dialog-title" class="confirm-title">{{ confirmService.options().title }}</h3>
    </div>

    <div class="confirm-body">
      <p id="confirm-dialog-desc" class="confirm-message">{{ confirmService.options().message }}</p>
    </div>

    <div class="confirm-actions">
      <button
        type="button"
        class="btn-cancel"
        (click)="confirmService.handleCancel()">
        {{ confirmService.options().cancelText || 'Cancel' }}
      </button>
      <button
        type="button"
        class="btn-confirm"
        [class.btn-danger]="confirmService.options().isDangerous"
        (click)="confirmService.handleConfirm()">
        {{ confirmService.options().confirmText || 'Confirm' }}
      </button>
    </div>
  </div>
</div>
